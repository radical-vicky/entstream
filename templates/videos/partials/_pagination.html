
{% if page_obj.has_other_pages %}
<nav class="vl-pagination" aria-label="Video pagination">
    {% if page_obj.has_previous %}
        <a href="?q={{ search_query|urlencode }}&sort={{ sort_by }}&page={{ page_obj.previous_page_number }}">
            Previous
        </a>
    {% endif %}

    <span>
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="?q={{ search_query|urlencode }}&sort={{ sort_by }}&page={{ page_obj.next_page_number }}">
            Next
        </a>
    {% endif %}
</nav>
{% endif %}
