
{% if request.user.is_staff %}
<div class="border border-[#252525] bg-[#101112] p-5">
    <h2 class="text-white font-semibold mb-4">
        Import external video
    </h2>

    <form method="POST"
          action="{% url 'videos:import_xvideos' %}"
          class="space-y-4">

        {% csrf_token %}

        <div>
            <label class="block text-sm text-gray-400 mb-2">
                Video title
            </label>

            <input
                type="text"
                name="title"
                maxlength="200"
                required
                placeholder="Enter video title"
                class="w-full bg-[#090b0c] border border-[#303030]
                       text-white p-3 outline-none
                       focus:border-orange-500"
            >
        </div>

        <div>
            <label class="block text-sm text-gray-400 mb-2">
                XVideos URL
            </label>

            <input
                type="url"
                name="external_url"
                required
                placeholder="https://www.xvideos.com/video..."
                class="w-full bg-[#090b0c] border border-[#303030]
                       text-white p-3 outline-none
                       focus:border-orange-500"
            >
        </div>

        <button
            type="submit"
            class="bg-orange-600 hover:bg-orange-500
                   text-white px-5 py-3 text-sm font-semibold"
        >
            Submit for review
        </button>
    </form>
</div>
{% endif %}
