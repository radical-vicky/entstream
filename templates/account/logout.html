
{% extends "base.html" %}
{% load i18n %}

{% block title %}Sign Out | StreamSphere{% endblock %}

{% block content %}
<style>
.account-page{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:30px 16px;background:#090b0c;color:#f5f5f5}
.account-card{width:100%;max-width:440px;padding:40px;border:1px solid #292d2f;background:#0e1011}
.account-eyebrow{color:#ff7900;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.account-card h1{margin:12px 0;color:#fff;font-size:29px;font-weight:800}
.account-card p{color:#a0a5a7;font-size:14px;line-height:1.8}
.account-button{width:100%;min-height:45px;margin-top:18px;border:0;border-radius:0;background:#ff7900;color:#17100a;font-weight:800;cursor:pointer}
.account-button:hover{background:#ff8b20}
.account-link{display:block;margin-top:20px;color:#ff7900;text-align:center;text-decoration:none;font-size:13px}
</style>

<div class="account-page">
    <section class="account-card">
        <div class="account-eyebrow">Leaving StreamSphere</div>
        <h1>Sign out?</h1>
        <p>Are you sure you want to sign out of your account?</p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}

            {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
            {% endif %}

            <button class="account-button" type="submit">Yes, Sign Me Out</button>
        </form>

        <a class="account-link" href="{% url 'home' %}">Stay on StreamSphere</a>
    </section>
</div>
{% endblock %}
