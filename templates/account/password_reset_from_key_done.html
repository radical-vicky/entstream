
{% extends "base.html" %}
{% load i18n %}

{% block title %}Password Updated | StreamSphere{% endblock %}

{% block content %}
<style>
.account-page{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:30px 16px;background:#090b0c;color:#f5f5f5}
.account-card{width:100%;max-width:460px;padding:40px;border:1px solid #292d2f;background:#0e1011}
.account-icon{width:54px;height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:25px;border:1px solid #ff7900;color:#ff7900;font-size:25px}
.account-eyebrow{color:#ff7900;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.account-card h1{margin:12px 0;color:#fff;font-size:29px;font-weight:800}
.account-card p{color:#a0a5a7;font-size:14px;line-height:1.8}
.account-button{display:block;margin-top:25px;padding:14px;background:#ff7900;color:#17100a;text-align:center;text-decoration:none;font-size:13px;font-weight:800}
.account-button:hover{background:#ff8b20}
</style>

<div class="account-page">
    <section class="account-card">
        <div class="account-icon" aria-hidden="true">✓</div>
        <div class="account-eyebrow">Update complete</div>
        <h1>Password changed</h1>
        <p>Your password has been updated successfully. You can now sign in using your new password.</p>
        <a class="account-button" href="{% url 'account_login' %}">Sign In to StreamSphere</a>
    </section>
</div>
{% endblock %}
