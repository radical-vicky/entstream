
{% if user.is_authenticated %}
    {% if target_type and target_id %}
        <a
            class="ss-report-link"
            href="{% url 'moderation:create_report' target_type target_id %}"
            aria-label="Report this {{ target_type }}"
        >
            Report
        </a>
    {% endif %}
{% endif %}

<style>
.ss-report-link {
    display: inline-flex;
    align-items: center;
    padding: 7px 10px;
    border: 1px solid #414149;
    background: #17171b;
    color: #fca5a5 !important;
    text-decoration: none;
    font-size: 12px;
    font-weight: 750;
    border-radius: 2px;
}
.ss-report-link:hover {
    border-color: #ef4444;
    background: #291416;
}
</style>
